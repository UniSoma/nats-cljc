# nats-server config for the JWT-auth test leg: decentralized operator mode with
# an in-memory account resolver. Serves BOTH the {:jwt ... :seed ...} and
# {:creds "..."} legs — the same nsc-generated user authenticates either way.
# Distinct ports from the other auth servers so every server runs side by side.
# TCP for the JVM leg, ws:// for the CLJS legs (ADR 0001 / 0003). The operator
# and account JWTs below were generated once with nsc (see
# docs/agents/running-tests.md); the user JWT + seed (and bundled creds) live in
# the test.
port: 4225

websocket {
  port: 8083
  no_tls: true
}

// Operator "AuthOp"
operator: eyJ0eXAiOiJKV1QiLCJhbGciOiJlZDI1NTE5LW5rZXkifQ..H-919GBFHgl_T4BPMZGUzlMBDXCcK_HMROLsQcDnPFZFQtd--WHb4ullofwQ1gkW3c_NayC9G0xCzyzKn9idAQ

resolver: MEMORY

