# nats-server config for the user/password-auth test leg. Distinct ports from
# the anonymous (ci/nats.conf) and token (ci/nats-token.conf) servers so all
# three run side by side. TCP for the JVM leg, ws:// for the CLJS legs.
port: 4224

websocket {
  port: 8082
  no_tls: true
}

authorization {
  user: "app"
  password: "app-pass"
}
