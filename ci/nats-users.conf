# nats-server config for the static-users auth legs: user/password AND nkey.
# Both are entries in one `users` array, which NATS authenticates independently
# — token and operator/JWT modes each demand their own server, but static users
# combine, so these two legs fold onto one instance. Distinct ports from the
# anonymous (ci/nats.conf) and token (ci/nats-token.conf) servers. TCP for the
# JVM leg, ws:// for the CLJS legs (ADR 0001 / 0003). The nkey public key was
# generated once with nsc (see docs/agents/running-tests.md); the matching seed
# and the user/password live in the test.
#
# A third `restricted` user is denied subscribe to "forbidden.>": subscribing
# there draws a server-side Permissions Violation, the only portable trigger for
# the connection-level :permissions-violation error (ADR 0006). It rides this
# same server (static users combine), so it adds no 5th instance; the app/nkey
# users are untouched.
port: 4224

websocket {
  port: 8082
  no_tls: true
}

authorization {
  users: [
    { user: "app", password: "app-pass" }
    { nkey: "UCJMN7UXB6Q4V45Q3GIN5F444OGBFBTQ5GT7476YGRWYMUXC7TQLHYKU" }
    { user: "restricted", password: "restricted-pass", permissions: { subscribe: { deny: "forbidden.>" } } }
  ]
}
