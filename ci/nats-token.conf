# nats-server config for the token-auth test leg. Distinct ports from the
# anonymous server (ci/nats.conf) so all three auth servers run side by side.
# TCP for the JVM leg, ws:// for the CLJS legs (ADR 0001 / 0003).
port: 4223

websocket {
  port: 8081
  no_tls: true
}

authorization {
  token: "s3cr3t-token"
}
