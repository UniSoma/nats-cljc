# nats-server config for CI. The WebSocket listener is mandatory: every CLJS
# platform reaches NATS over ws:// (ADR 0001 / 0003), so each CI job starts a
# ws-reachable server even though the scaffold has no NATS behavior yet.
port: 4222

# HTTP monitoring endpoint. The :name connect-option test reads /connz off this
# server to assert the connection name reaches the server (nts-01kt87wh29be).
http_port: 8222

websocket {
  port: 8080
  no_tls: true
}
