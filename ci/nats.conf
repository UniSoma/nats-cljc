# nats-server config for CI. The WebSocket listener is mandatory: every CLJS
# platform reaches NATS over ws:// (ADR 0001 / 0003), so each CI job starts a
# ws-reachable server even though the scaffold has no NATS behavior yet.
port: 4222

# HTTP monitoring endpoint. The :name connect-option test reads /connz off this
# server to assert the connection name reaches the server (nts-01kt87wh29be).
http_port: 8222

websocket {
  port: 8080
  no_tls: true
}

# JetStream, enabled on the anonymous server only (ADR 0017): the Phase-2
# suite obtains a context here, while the auth servers stay JS-disabled so the
# token leg (:4223) exercises :jetstream-not-enabled. The store_dir is gitignored
# and tests default to :storage :memory, so streams vanish on restart even if a
# crashed test skips teardown. Requires nats-server >= 2.12.
jetstream {
  store_dir: ci/.jsstore
}
