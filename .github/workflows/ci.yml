name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs for the same branch/PR to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default token: this workflow only needs to read the repo.
permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.platform }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: jvm
            node: false
          - platform: node
            node: true
          - platform: browser
            node: true

    steps:
      - uses: actions/checkout@v5

      # Cache resolved Clojure deps (Maven artifacts + git libs) across runs.
      # All three jobs hit the JVM toolchain, so every job benefits.
      - name: Cache Clojure deps
        uses: actions/cache@v5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-cljdeps-${{ hashFiles('deps.edn') }}
          restore-keys: ${{ runner.os }}-cljdeps-

      # Every job runs four NATS servers, each WebSocket-enabled on its own
      # ports: anonymous (4222/8080), token (4223/8081), static users
      # (4224/8082), and JWT/operator (4225/8083). NATS forces anonymous, token,
      # and operator/JWT auth onto separate servers, but static users combine —
      # so the user/password and nkey legs share ci/nats-users.conf, and the jwt
      # server serves both the {:jwt :seed} and {:creds} legs (see ci/nats-*.conf).
      - name: Install and start nats-servers (anon + token + users + jwt)
        run: |
          curl -sSL https://github.com/nats-io/nats-server/releases/download/v2.14.1/nats-server-v2.14.1-linux-amd64.tar.gz | tar xz
          sudo mv nats-server-v2.14.1-linux-amd64/nats-server /usr/local/bin/nats-server
          nats-server --version
          nats-server -c ci/nats.conf       > nats-server.log        2>&1 &
          nats-server -c ci/nats-token.conf > nats-server-token.log  2>&1 &
          nats-server -c ci/nats-users.conf > nats-server-users.log  2>&1 &
          nats-server -c ci/nats-jwt.conf   > nats-server-jwt.log    2>&1 &
          sleep 1
          echo "nats-servers started: anon :8080, token :8081, users :8082, jwt :8083 (ws)"

      # shadow-cljs and tools.build both run on the JVM, so all jobs need it.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest

      - uses: actions/setup-node@v5
        if: matrix.node
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm deps
        if: matrix.node
        run: npm ci

      - name: JVM build + test
        if: matrix.platform == 'jvm'
        run: |
          clojure -T:build jar
          clojure -X:test

      - name: Node test
        if: matrix.platform == 'node'
        run: |
          npx shadow-cljs compile node
          node target/node-tests.js

      # Externs gate: an :advanced compile. nats-cljc
      # ships as source, so the optimizing compile happens in consumers' builds,
      # never in the :none test compiles above — an un-inferable (^js-less) JS
      # property access renames silently under advanced, invisibly to CI. shadow
      # prints "Cannot infer target type" but still exits 0, so grep and fail. No
      # :silence-unsafe alias: CI is JDK 21, where that flag does not exist (deps.edn).
      - name: Externs gate (advanced compile)
        if: matrix.platform == 'node'
        run: |
          set -o pipefail
          npx shadow-cljs release externs-check 2>&1 | tee externs-check.log
          if grep -q "Cannot infer target type" externs-check.log; then
            echo "::error::Externs gate: a JS-interop property access is missing a ^js hint (see 'Cannot infer' above)."
            exit 1
          fi

      # Bundle-isolation guard (ADR 0016): @nats-io/jetstream and @nats-io/kv are
      # unconditional npm deps, but each enters a consumer's bundle only when a
      # namespace they require imports it. Release the core-only build (its
      # single entry is nats-cljc.core) and fail if the optimized bundle
      # contains any JetStream or KV bytes ('$KV.' is @nats-io/kv's
      # subject-prefix literal) — a hit means the ["@nats-io/jetstream"] or
      # ["@nats-io/kv"] import leaked into a core-reachable namespace.
      - name: Bundle-isolation guard (core-only release)
        if: matrix.platform == 'node'
        run: |
          npx shadow-cljs release core-bundle-check
          if grep -riq -e 'jetstream' -e '\$JS\.API' -e '\$KV\.' target/core-bundle-check/*.js; then
            echo "::error::Bundle guard: the core-only bundle contains @nats-io/jetstream or @nats-io/kv bytes — an import leaked into a core-reachable namespace (ADR 0016)."
            grep -rioc -e 'jetstream' -e '\$JS\.API' -e '\$KV\.' target/core-bundle-check/*.js
            exit 1
          fi

      # CI is the single source of browser truth (ADR 0010), so provision Chrome
      # explicitly and version-pinned instead of leaning on whatever Chrome the
      # ubuntu-latest image happens to ship. Pin the major version (latest patch
      # within it) for reproducible behavior that survives runner-image bumps.
      - name: Set up Chrome
        if: matrix.platform == 'browser'
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: '149'

      - name: Browser-headless test (karma)
        if: matrix.platform == 'browser'
        # Point karma-chrome-launcher at the provisioned binary, not PATH.
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          npx shadow-cljs compile browser
          npx karma start --single-run
