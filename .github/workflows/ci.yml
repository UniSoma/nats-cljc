name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: jvm
            node: false
          - platform: node
            node: true
          - platform: browser
            node: true

    steps:
      - uses: actions/checkout@v4

      # Every job runs a NATS server with the WebSocket listener enabled.
      - name: Install and start nats-server (websocket enabled)
        run: |
          curl -sSL https://github.com/nats-io/nats-server/releases/download/v2.14.1/nats-server-v2.14.1-linux-amd64.tar.gz | tar xz
          sudo mv nats-server-v2.14.1-linux-amd64/nats-server /usr/local/bin/nats-server
          nats-server --version
          nats-server -c ci/nats.conf > nats-server.log 2>&1 &
          sleep 1
          echo "nats-server started with ws:// listener on :8080"

      # shadow-cljs and tools.build both run on the JVM, so all jobs need it.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: DeLaGuardo/setup-clojure@12.5
        with:
          cli: latest

      - uses: actions/setup-node@v4
        if: matrix.node
        with:
          node-version: '20'

      - name: Install npm deps
        if: matrix.node
        run: npm install

      - name: JVM build + test
        if: matrix.platform == 'jvm'
        run: |
          clojure -T:build jar
          clojure -X:test

      - name: Node test
        if: matrix.platform == 'node'
        run: |
          npx shadow-cljs compile node
          node target/node-tests.js

      - name: Browser-headless test (karma)
        if: matrix.platform == 'browser'
        run: |
          npx shadow-cljs compile browser
          npx karma start --single-run
